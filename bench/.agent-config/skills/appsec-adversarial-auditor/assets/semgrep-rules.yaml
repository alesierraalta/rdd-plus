rules:
  - id: raw-sql-injection-taint
    languages: [python]
    severity: ERROR
    message: "Untrusted input detected in raw SQL execution. Use parameterized queries."
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 - Injection"
    mode: taint
    pattern-sources:
      - pattern: request.json[...]
      - pattern: request.args[...]
      - pattern: request.form[...]
    pattern-sinks:
      - pattern: sqlalchemy.text(...)
      - pattern: $DB.session.execute(...)
      - pattern: $CURSOR.execute(...)
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: uuid.UUID(...)

  - id: ssrf-untrusted-request-taint
    languages: [python]
    severity: ERROR
    message: "Possible SSRF: untrusted URL passed directly to outbound HTTP request."
    metadata:
      cwe: "CWE-918"
      owasp: "A10:2021 - SSRF"
    mode: taint
    pattern-sources:
      - pattern: request.json.get("url")
      - pattern: $PAYLOAD.url
    pattern-sinks:
      - pattern: requests.get($URL, ...)
      - pattern: httpx.get($URL, ...)
    pattern-sanitizers:
      - pattern: validate_outbound_ip(...)
